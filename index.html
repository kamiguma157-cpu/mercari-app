<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="顧客名簿" />
  <meta name="theme-color" content="#FF0211" />
  <title>顧客名簿</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; background: #F5F5F5; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const STORAGE_KEY = "mercari-customers-v1";
    const SAMPLE = [
      { id: 1, name: "田中 花子", address: "東京都渋谷区代々木1-2-3", product: "ワイヤレスイヤホン", price: 3800, comment: "梱包も丁寧で大変満足！" },
      { id: 2, name: "佐藤 一郎", address: "大阪府大阪市北区梅田2-4-6", product: "古着デニムジャケット", price: 2500, comment: "連絡が少し遅かったが問題なし。" },
    ];
    const EMPTY = { name: "", address: "", product: "", price: "", comment: "" };

    function loadCustomers() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch(e) {}
      return SAMPLE;
    }

    function saveCustomers(list) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch(e) {}
    }

    function FormField({ label, children }) {
      return (
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: 12, color: "#888", display: "block", marginBottom: 5, fontWeight: 600 }}>{label}</label>
          {children}
        </div>
      );
    }

    const inp = {
      width: "100%", border: "1.5px solid #E8E8E8", borderRadius: 10,
      padding: "11px 14px", fontSize: 15, outline: "none",
      background: "#FAFAFA", fontFamily: "inherit",
    };

    function App() {
      const [customers, setCustomers] = useState(loadCustomers);
      const [search, setSearch] = useState("");
      const [selected, setSelected] = useState(null);
      const [showForm, setShowForm] = useState(false);
      const [editData, setEditData] = useState(EMPTY);
      const [isEdit, setIsEdit] = useState(false);
      const [deleteId, setDeleteId] = useState(null);
      const nextId = useRef(Math.max(0, ...loadCustomers().map(c => c.id)) + 1);

      useEffect(() => { saveCustomers(customers); }, [customers]);

      const set = key => e => setEditData(d => ({ ...d, [key]: e.target.value }));
      const filtered = customers.filter(c =>
        c.name.includes(search) || c.address.includes(search) || c.product.includes(search)
      );

      function openAdd() { setEditData(EMPTY); setIsEdit(false); setShowForm(true); }
      function openEdit(c) { setEditData({...c}); setIsEdit(true); setShowForm(true); }

      function save() {
        if (!editData.name.trim()) return;
        const data = { ...editData, price: Number(editData.price) || 0 };
        if (isEdit) {
          const updated = customers.map(c => c.id === data.id ? data : c);
          setCustomers(updated);
          setSelected(data);
        } else {
          const newC = { ...data, id: nextId.current++ };
          setCustomers([...customers, newC]);
          setSelected(newC);
        }
        setShowForm(false);
      }

      function del(id) {
        setCustomers(customers.filter(c => c.id !== id));
        if (selected?.id === id) setSelected(null);
        setDeleteId(null);
      }

      return (
        <div style={{ minHeight: "100vh", background: "#F5F5F5" }}>
          {/* Header */}
          <div style={{ background: "#FF0211", padding: "0 20px", height: 54, display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 50, boxShadow: "0 2px 10px rgba(255,2,17,0.25)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ background: "#fff", borderRadius: 7, width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, color: "#FF0211", fontSize: 13 }}>M</div>
              <span style={{ color: "#fff", fontWeight: 700, fontSize: 16 }}>顧客名簿</span>
            </div>
            <button onClick={openAdd} style={{ background: "#fff", color: "#FF0211", border: "none", borderRadius: 20, padding: "7px 16px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>＋ 追加</button>
          </div>

          {/* Search */}
          <div style={{ padding: "14px 16px", background: "#fff", borderBottom: "1px solid #EBEBEB" }}>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍　名前・住所・商品で検索"
              style={{ width: "100%", border: "1.5px solid #E8E8E8", borderRadius: 24, padding: "10px 16px", fontSize: 14, outline: "none", background: "#F7F7F7" }} />
          </div>
          <div style={{ padding: "8px 16px", fontSize: 12, color: "#aaa" }}>{filtered.length}件</div>

          {/* List */}
          <div style={{ padding: "0 12px 80px" }}>
            {filtered.length === 0 && (
              <div style={{ textAlign: "center", padding: 60, color: "#bbb", fontSize: 14 }}>顧客が見つかりません</div>
            )}
            {filtered.map(c => (
              <div key={c.id} onClick={() => setSelected(selected?.id === c.id ? null : c)}
                style={{ background: "#fff", borderRadius: 14, marginBottom: 10, padding: 16, cursor: "pointer", boxShadow: selected?.id === c.id ? "0 0 0 2px #FF0211" : "0 1px 4px rgba(0,0,0,0.07)" }}>
                <div style={{ fontWeight: 700, fontSize: 16, color: "#111", marginBottom: 4 }}>{c.name}</div>
                <div style={{ fontSize: 12, color: "#999", marginBottom: 10 }}>📍 {c.address || "住所未登録"}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <span style={{ background: "#FFF3F3", color: "#FF0211", borderRadius: 6, padding: "3px 10px", fontSize: 13, fontWeight: 600 }}>{c.product}</span>
                  <span style={{ fontSize: 15, fontWeight: 700, color: "#222" }}>¥{Number(c.price).toLocaleString()}</span>
                </div>
                {c.comment ? (
                  <div style={{ marginTop: 10, background: "#FAFAFA", borderRadius: 8, padding: "8px 12px", fontSize: 13, color: "#666", lineHeight: 1.5, borderLeft: "3px solid #FFD0D0" }}>
                    💬 {c.comment}
                  </div>
                ) : null}
                {selected?.id === c.id && (
                  <div style={{ borderTop: "1px solid #F0F0F0", marginTop: 12, paddingTop: 12, display: "flex", gap: 8 }}>
                    <button onClick={e => { e.stopPropagation(); openEdit(c); }} style={{ flex: 1, background: "#FF0211", color: "#fff", border: "none", borderRadius: 10, padding: 10, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>✏️ 編集</button>
                    <button onClick={e => { e.stopPropagation(); setDeleteId(c.id); }} style={{ flex: 1, background: "#F5F5F5", color: "#888", border: "none", borderRadius: 10, padding: 10, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>🗑 削除</button>
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* Form Modal */}
          {showForm && (
            <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100 }}>
              <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", padding: "24px 20px 40px", width: "100%", maxWidth: 480, maxHeight: "90vh", overflowY: "auto" }}>
                <div style={{ width: 40, height: 4, background: "#E0E0E0", borderRadius: 2, margin: "0 auto 20px" }} />
                <div style={{ fontWeight: 700, fontSize: 18, color: "#111", marginBottom: 22 }}>{isEdit ? "情報を編集" : "新規顧客登録"}</div>
                <FormField label="氏名 *"><input value={editData.name} onChange={set("name")} placeholder="田中 花子" style={inp} /></FormField>
                <FormField label="住所"><input value={editData.address} onChange={set("address")} placeholder="東京都渋谷区代々木1-2-3" style={inp} /></FormField>
                <FormField label="お買い上げ商品 *"><input value={editData.product} onChange={set("product")} placeholder="ワイヤレスイヤホン" style={inp} /></FormField>
                <FormField label="価格（円）"><input type="number" value={editData.price} onChange={set("price")} placeholder="3800" style={inp} /></FormField>
                <FormField label="評価コメント">
                  <textarea value={editData.comment} onChange={set("comment")} placeholder="取引の感想やメモを入力..." rows={3}
                    style={{ ...inp, resize: "vertical", lineHeight: 1.6 }} />
                </FormField>
                <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
                  <button onClick={() => setShowForm(false)} style={{ flex: 1, background: "#F0F0F0", color: "#666", border: "none", borderRadius: 12, padding: 14, fontSize: 15, fontWeight: 600, cursor: "pointer" }}>キャンセル</button>
                  <button onClick={save} style={{ flex: 2, background: "#FF0211", color: "#fff", border: "none", borderRadius: 12, padding: 14, fontSize: 15, fontWeight: 700, cursor: "pointer" }}>{isEdit ? "保存" : "登録"}</button>
                </div>
              </div>
            </div>
          )}

          {/* Delete Confirm */}
          {deleteId && (
            <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 20 }}>
              <div style={{ background: "#fff", borderRadius: 16, padding: "28px 24px", maxWidth: 300, width: "100%", textAlign: "center" }}>
                <div style={{ fontSize: 36, marginBottom: 10 }}>🗑</div>
                <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6 }}>削除しますか？</div>
                <div style={{ fontSize: 13, color: "#aaa", marginBottom: 22 }}>この操作は元に戻せません</div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => setDeleteId(null)} style={{ flex: 1, background: "#F0F0F0", color: "#666", border: "none", borderRadius: 10, padding: 12, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>キャンセル</button>
                  <button onClick={() => del(deleteId)} style={{ flex: 1, background: "#FF0211", color: "#fff", border: "none", borderRadius: 10, padding: 12, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>削除</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
